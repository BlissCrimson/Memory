<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
    <link rel="icon" type="image/svg+xml" href="/memory/assets/icons/stadia_controller.svg">
    <script>
        // GitHub Pages serves this file for any unknown path (e.g. a reload
        // on /memory/game). It encodes the real path into a query string and
        // redirects to index.html, which restores it via history.replaceState
        // before the router boots (see the inline script there).
        // pathSegmentsToKeep = 1 because the app is hosted under /memory/.
        // Pattern: https://github.com/rafgraph/spa-github-pages
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
            l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
            l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
            l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash,
        );
    </script>
</head>

<!--
  Inline style instead of an external/SCSS stylesheet: this page must stay
  readable even if the app's CSS bundle fails to load, since the redirect
  above can fail or be visibly delayed (e.g. JS disabled/blocked).
-->
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#303131;color:#ffffff;font-family:sans-serif;">
    <p style="text-align:center;">Redirecting&hellip;</p>
</body>

</html>
